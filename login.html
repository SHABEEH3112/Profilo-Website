<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
   <style>
    *{
    padding: 0px;
    margin: 0px;
}
body{
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: rgb(113, 172, 223);
}
.containor{
    background-color: #f5f5f5;
    border-radius: 20px;
    width: 350px;
    padding: 35px;
}
h2{
    text-align: center;
    color: blue;
    margin-bottom: 20px;
}
.input-box{
      display:flex;
    align-items:center;
    background:#f1f1f1;
    border-radius:10px;
    padding:12px;
    margin-bottom:15px;
}
.input-box input{
    flex:1;
    border:none;
    background:transparent;
    outline:none;
    padding:0 10px;
    font-size:15px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:30px;
    background:#1e90ff;
    color:#fff;
    font-size:16px;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:#0077ff;
}

p{
    text-align:center;
    margin-top:20px;
    color:#666;
}

p a{
    text-decoration:none;
    color:#1e90ff;
    font-weight:bold;
}
   </style>
</head>

<body>
    <div class="containor">
        <h2>Sign Up</h2>
        <div class="input-box">
            <i class="fa-solid fa-user"></i>
            <input type="text" placeholder="Name">
        </div>
          <div class="input-box">
        <i class="fa-solid fa-envelope"></i>
        <input type="email" placeholder="Email">
    </div>
   
        <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input type="password" placeholder="Password">
            <i class="fa-solid fa-eye"></i>
        </div>
        <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input type="password" placeholder="Confirm password">
            <i class="fa-solid fa-eye"></i>
        </div>
        <div>
            <button>Sign Up</button>
            <p>Already, Have an account?
                <a href="Login.Html">Login</a>
            </p>
        </div>

    </div>
</body>

</html>
