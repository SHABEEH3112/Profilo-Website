<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Simple and easy-to-use expense tracker for managing income and expenses.">
    <meta name="keywords" content="expense tracker, income tracker, budget, expenses">
    <meta name="author" content="Your Name">

    <title>Expense Tracker</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #666;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 24px;
            font-weight: bold;
        }

        .income {
            color: green;
        }

        .expense {
            color: red;
        }

        .balance {
            color: #333;
        }

        .form-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .form-box h2 {
            margin-bottom: 15px;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            background: #222;
            color: white;
            cursor: pointer;
            border: none;
        }

        button:hover {
            background: #444;
        }

        .transactions {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .transactions h2 {
            margin-bottom: 15px;
        }

        #transactionList {
            list-style: none;
        }

        .transaction {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .transaction:last-child {
            border-bottom: none;
        }

        .transaction-info strong {
            display: block;
            margin-bottom: 5px;
        }

        .delete-btn {
            width: auto;
            padding: 7px 12px;
            background: red;
            margin: 0;
        }

        .delete-btn:hover {
            background: darkred;
        }

        @media (max-width: 600px) {
            .summary {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Expense Tracker</h1>

        <div class="summary">

            <div class="card">
                <h3>Balance</h3>
                <p class="balance" id="balance">Rs 0</p>
            </div>

            <div class="card">
                <h3>Income</h3>
                <p class="income" id="income">Rs 0</p>
            </div>

            <div class="card">
                <h3>Expenses</h3>
                <p class="expense" id="expense">Rs 0</p>
            </div>

        </div>

        <div class="form-box">

            <h2>Add Transaction</h2>

            <input
                type="text"
                id="description"
                placeholder="Enter description"
            >

            <input
                type="number"
                id="amount"
                placeholder="Enter amount"
            >

            <select id="type">
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>

            <button onclick="addTransaction()">
                Add Transaction
            </button>

        </div>


        <div class="transactions">

            <h2>Transaction History</h2>

            <ul id="transactionList"></ul>

        </div>

    </div>


    <script>

        let transactions = [];

        function addTransaction() {

            const description =
                document.getElementById("description").value;

            const amount =
                Number(document.getElementById("amount").value);

            const type =
                document.getElementById("type").value;

            if (description === "" || amount <= 0) {
                alert("Please enter valid information.");
                return;
            }

            const transaction = {
                id: Date.now(),
                description: description,
                amount: amount,
                type: type
            };

            transactions.push(transaction);

            document.getElementById("description").value = "";
            document.getElementById("amount").value = "";

            updateTracker();
        }


        function updateTracker() {

            let income = 0;
            let expense = 0;

            const list =
                document.getElementById("transactionList");

            list.innerHTML = "";

            transactions.forEach(transaction => {

                if (transaction.type === "income") {
                    income += transaction.amount;
                } else {
                    expense += transaction.amount;
                }

                const li = document.createElement("li");

                li.className = "transaction";

                li.innerHTML = `
                    <div class="transaction-info">
                        <strong>${transaction.description}</strong>
                        <span>
                            ${transaction.type === "income" ? "+" : "-"}
                            Rs ${transaction.amount}
                        </span>
                    </div>

                    <button
                        class="delete-btn"
                        onclick="deleteTransaction(${transaction.id})">
                        Delete
                    </button>
                `;

                list.appendChild(li);
            });

            const balance = income - expense;

            document.getElementById("income").textContent =
                "Rs " + income;

            document.getElementById("expense").textContent =
                "Rs " + expense;

            document.getElementById("balance").textContent =
                "Rs " + balance;
        }


        function deleteTransaction(id) {

            transactions =
                transactions.filter(transaction =>
                    transaction.id !== id
                );

            updateTracker();
        }

    </script>

</body>
</html>
